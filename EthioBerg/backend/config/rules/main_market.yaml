rules:
  - rule_id: ESX_MAIN_TRACK_RECORD
    name: Minimum operating track record
    segment: MAIN
    field: track_record_years
    operator: GTE
    threshold: 3
    unit: years
    effective_from: "2025-01-01"
    effective_to: null
    source_document_id: src-esx-rulebook
    source_section: Volume C, applicable listing provision
    review_status: APPROVED
    unknown_result: MISSING_EVIDENCE
    category: Track record

  - rule_id: ESX_MAIN_MARKET_CAP
    name: Minimum market capitalization
    segment: MAIN
    field: market_cap_etb
    operator: GTE
    threshold: 500000000
    unit: ETB
    effective_from: "2025-01-01"
    effective_to: null
    source_document_id: src-esx-rulebook
    source_section: Volume C, Main Market listing criteria
    review_status: APPROVED
    unknown_result: MISSING_EVIDENCE
    category: Financial thresholds

  - rule_id: ESX_MAIN_FREE_FLOAT
    name: Minimum free float percentage
    segment: MAIN
    field: free_float_pct
    operator: GTE
    threshold: 15
    unit: percent
    effective_from: "2025-01-01"
    effective_to: null
    source_document_id: src-esx-rulebook
    source_section: Volume C, public float requirement
    review_status: APPROVED
    unknown_result: MISSING_EVIDENCE
    category: Shareholder structure

  - rule_id: ESX_MAIN_SHAREHOLDERS
    name: Minimum number of shareholders
    segment: MAIN
    field: shareholder_count
    operator: GTE
    threshold: 100
    unit: shareholders
    effective_from: "2025-01-01"
    effective_to: null
    source_document_id: src-esx-rulebook
    source_section: Volume C, shareholder dispersion
    review_status: APPROVED
    unknown_result: MISSING_EVIDENCE
    category: Shareholder structure
