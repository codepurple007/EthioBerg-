# Render Blueprint for EthioBerg.
#
# Two services: the FastAPI backend and the Next.js frontend.
#
# Both run on free instances, which need no payment method. The trade-off is that
# free instances cannot mount a persistent disk and they stop after 15 minutes of
# inactivity, so the backend restarts from a clean filesystem. Everything SQLite
# holds — the source library, ingestion setting versions, evaluation history, the
# audit log, and uploaded documents — resets to its seeded state on each restart.
# The regulatory corpus ships in the image and the Pinecone index lives outside
# Render, so question answering is unaffected.
#
# To make that state durable, upgrade ethioberg-api to a paid instance and attach
# a disk at /var/data. ETHIOBERG_DATA_DIR already points there, so no code or
# configuration changes are needed:
#
#     plan: starter
#     disk:
#       name: ethioberg-data
#       mountPath: /var/data
#       sizeGB: 1

services:
  - type: web
    name: ethioberg-api
    # Docker rather than the native Python runtime: OCR needs the Tesseract system
    # binary, and the native runtime cannot install system packages. Build and start
    # commands come from EthioBerg/backend/Dockerfile.
    runtime: docker
    plan: free
    region: oregon
    rootDir: EthioBerg/backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # The Python version is pinned by the Dockerfile's base image, so PYTHON_VERSION
      # does not apply here.
      # Keeps the database, uploads, and stored sources in one place. Ephemeral on a
      # free instance; attaching a disk at this path later makes it durable.
      - key: ETHIOBERG_DATA_DIR
        value: /var/data
      # The frontend calls this API from the browser, so its public origin must be
      # allowed. Matched by pattern to avoid a circular service reference.
      - key: CORS_ALLOW_ORIGIN_REGEX
        value: ^https://ethioberg-web(-[a-z0-9]+)?\.onrender\.com$
      # Retrieval defaults to "auto": the hosted vector index serves queries when
      # this key is present, and the in-process retriever takes over when it is
      # blank. Leave it empty to deploy without Pinecone.
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: ethioberg-regulatory
      - key: PINECONE_NAMESPACE
        value: regulatory

  - type: web
    name: ethioberg-web
    runtime: node
    plan: free
    region: oregon
    rootDir: EthioBerg
    # NEXT_PUBLIC_* values are inlined into the client bundle at build time, so the
    # API URL has to be present here rather than only at runtime.
    buildCommand: npm ci && NEXT_PUBLIC_API_URL="https://$API_EXTERNAL_HOSTNAME" npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      # Public hostname of the API service, e.g. ethioberg-api.onrender.com.
      # `property: host` would give the private hostname, which the browser cannot reach.
      - key: API_EXTERNAL_HOSTNAME
        fromService:
          name: ethioberg-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
